<!DOCTYPE html>
<html lang="pt-PT" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Comando Quiral - Tático</title>
    
    <!-- PWA / App Install -->
    <link rel="manifest" href="manifest.json">
    <link rel="icon" href="icon.svg" type="image/svg+xml">
    <meta name="theme-color" content="#0f172a">

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        gray: { 850: '#1f2937', 900: '#111827', 950: '#030712' },
                        blue: { 400: '#60a5fa', 500: '#3b82f6', 900: '#1e3a8a' },
                        yellow: { 400: '#facc15', 500: '#eab308', 900: '#713f12' },
                        quiral: '#10b981'
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Leaflet CSS & JS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap');
        
        body { font-family: 'Inter', sans-serif; background-color: #0f172a; color: #e2e8f0; }
        .tech-font { font-family: 'Share Tech Mono', monospace; }
        .glass-panel { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(10px); border: 1px solid rgba(51, 65, 85, 0.5); }
        .pulse { animation: pulse-anim 2s infinite; }
        
        @keyframes pulse-anim {
            0% { opacity: 1; box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.4); }
            50% { opacity: 0.7; box-shadow: 0 0 0 10px rgba(16, 185, 129, 0); }
            100% { opacity: 1; box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); }
        }

        /* Mapa e Elementos Táticos */
        #map { background-color: #1e293b; z-index: 10; }
        .leaflet-container { font-family: 'Inter', sans-serif; }
        
        /* Marcador estilo Uber (Mira Central) */
        #map-crosshair {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 40px; height: 40px; pointer-events: none; z-index: 1000; opacity: 0; transition: opacity 0.3s;
        }
        #map-crosshair::before, #map-crosshair::after {
            content: ''; position: absolute; background: #c026d3;
        }
        #map-crosshair::before { top: 19px; left: 0; width: 40px; height: 2px; }
        #map-crosshair::after { left: 19px; top: 0; height: 40px; width: 2px; }
        
        #btn-confirm-target {
            position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%) scale(0.9);
            z-index: 1000; opacity: 0; pointer-events: none; transition: all 0.3s;
        }
        #btn-confirm-target.active { opacity: 1; pointer-events: auto; transform: translateX(-50%) scale(1); }

        /* Toast Notifications */
        #toast-container { position: fixed; top: 20px; left: 50%; transform: translateX(-50%); z-index: 9999; display: flex; flex-direction: column; gap: 10px; }
        .toast { background: rgba(15, 23, 42, 0.9); border: 1px solid #334155; color: white; padding: 12px 24px; border-radius: 8px; font-weight: bold; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1); transition: opacity 0.3s, transform 0.3s; }
        .toast.success { border-bottom: 3px solid #10b981; }
        .toast.error { border-bottom: 3px solid #ef4444; }

        /* Nodes HTML Icons */
        .node-marker {
            display: flex; justify-content: center; align-items: center; font-weight: bold; color: #000; font-size: 14px;
            border-radius: 50%; border: 3px solid rgba(255,255,255,0.7); box-shadow: 0 0 10px rgba(0,0,0,0.5);
            transition: transform 0.2s; pointer-events: auto !important; cursor: pointer;
        }
        .node-marker:active { transform: scale(0.9); }
        .node-marker.neutro { background: #9ca3af; }
        .node-marker.azul { background: #60a5fa; box-shadow: 0 0 15px #60a5fa; color: white;}
        .node-marker.amarela { background: #facc15; box-shadow: 0 0 15px #facc15; }

        /* Scrollbar logs */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
    </style>
</head>
<body class="h-screen w-screen overflow-hidden flex flex-col">

    <div id="toast-container"></div>

    <!-- Ecrã de Login -->
    <div id="login-screen" class="fixed inset-0 z-50 flex items-center justify-center bg-gray-950 p-4">
        <div class="glass-panel p-8 rounded-xl max-w-sm w-full text-center">
            <h1 class="text-3xl tech-font text-quiral font-bold mb-6">[ COMANDO QUIRAL ]</h1>
            <input type="password" id="login-pass" placeholder="Código de Acesso" class="w-full bg-gray-900 border border-gray-700 rounded p-3 text-white text-center mb-4 focus:outline-none focus:border-quiral" onkeypress="if(event.key === 'Enter') fazerLogin()">
            <button onclick="fazerLogin()" class="w-full bg-quiral hover:bg-emerald-600 text-gray-950 font-bold py-3 rounded uppercase transition">Autenticar</button>
            <p id="login-error" class="text-red-500 text-sm mt-3 hidden">Código inválido</p>
        </div>
    </div>

    <div id="app-screen" class="hidden flex-col h-full w-full">
        
        <!-- Header -->
        <header class="flex-shrink-0 flex items-center justify-between p-3 lg:p-4 border-b border-gray-800 bg-gray-950/80">
            <div class="flex items-center gap-4">
                <button onclick="logout()" class="text-xs bg-gray-800 hover:bg-gray-700 px-3 py-1.5 rounded border border-gray-700 transition">
                    <i class="fa-solid fa-lock text-orange-400 mr-2"></i>SAIR
                </button>
            </div>
            
            <div class="text-center flex-1">
                <h1 class="text-xl md:text-3xl tech-font font-bold tracking-widest text-emerald-400">[ COMANDO QUIRAL ]</h1>
                <div id="status-badge" class="mt-1 inline-block px-3 py-0.5 rounded text-xs font-bold bg-gray-800 text-gray-500 border border-gray-600">A CONECTAR...</div>
            </div>

            <div class="flex items-center gap-3">
                <button onclick="toggleFullscreen()" class="w-8 h-8 rounded-full bg-gray-800 hover:bg-gray-700 flex items-center justify-center transition">
                    <i class="fa-solid fa-expand text-gray-400"></i>
                </button>
            </div>
        </header>

        <!-- Main Content -->
        <div class="flex-1 overflow-hidden flex flex-col md:flex-row p-2 gap-2">
            
            <!-- Esquerda: Mapa e Score -->
            <div class="w-full md:w-2/3 flex flex-col gap-2 h-1/2 md:h-full">
                
                <!-- Scoreboard -->
                <div class="glass-panel rounded-xl p-3 flex justify-between items-center shrink-0">
                    <div class="text-center w-1/3">
                        <div class="text-blue-400 font-bold text-lg md:text-xl tracking-wider">AZUL</div>
                        <div id="score-azul" class="text-3xl md:text-5xl tech-font font-bold text-white drop-shadow-[0_0_10px_rgba(96,165,250,0.8)]">0</div>
                    </div>
                    <div class="text-center w-1/3 flex flex-col items-center justify-center">
                        <div id="game-time" class="text-2xl md:text-4xl tech-font font-bold text-white mb-1">00:00</div>
                        <div id="game-mode" class="text-xs md:text-sm text-gray-400 font-bold tracking-widest">MODO: --</div>
                    </div>
                    <div class="text-center w-1/3">
                        <div class="text-yellow-400 font-bold text-lg md:text-xl tracking-wider">AMARELA</div>
                        <div id="score-amarelo" class="text-3xl md:text-5xl tech-font font-bold text-white drop-shadow-[0_0_10px_rgba(250,204,21,0.8)]">0</div>
                    </div>
                </div>

                <!-- Mapa Container -->
                <div class="glass-panel rounded-xl flex-1 relative overflow-hidden flex flex-col">
                    <div class="px-4 py-2 border-b border-gray-800 flex justify-between items-center shrink-0 bg-gray-900/50">
                        <span class="font-bold text-sm text-gray-300">MAPA TÁTICO <span id="node-count" class="text-gray-500 font-normal">(--/--)</span></span>
                        
                        <div class="flex gap-2">
                            <!-- Botões de Admin (Escondidos por defeito) -->
                            <button id="btn-centro" onclick="definirCentroMapa()" class="hidden text-xs bg-indigo-900/50 hover:bg-indigo-800 text-indigo-300 border border-indigo-700 px-3 py-1 rounded transition">
                                <i class="fa-solid fa-map-location-dot mr-1"></i> CENTRO
                            </button>
                            <button id="btn-save-layout" onclick="salvarLayout()" class="hidden text-xs bg-orange-900/50 hover:bg-orange-800 text-orange-300 border border-orange-700 px-3 py-1 rounded transition">
                                <i class="fa-solid fa-floppy-disk mr-1"></i> SALVAR LAYOUT
                            </button>
                            
                            <!-- Botão Localizar Jogador -->
                            <button onclick="centralizarNoJogador()" class="text-xs bg-blue-900/50 hover:bg-blue-800 text-blue-300 border border-blue-700 px-3 py-1 rounded transition" title="Localizar-me">
                                <i class="fa-solid fa-location-crosshairs"></i>
                            </button>
                            <!-- Botão Marcador Tático -->
                            <button id="btn-marcador" onclick="toggleMarcador()" class="text-xs bg-purple-900/50 hover:bg-purple-800 text-purple-300 border border-purple-700 px-3 py-1 rounded transition font-bold">
                                📍 MARCADOR
                            </button>
                        </div>
                    </div>
                    
                    <!-- Leaflet Div -->
                    <div id="map" class="flex-1 w-full relative">
                        <div id="map-crosshair"></div>
                        <button id="btn-confirm-target" onclick="confirmarMarcador()" class="bg-green-600 hover:bg-green-500 text-white font-bold py-3 px-6 rounded-full shadow-lg border-2 border-white">
                            <i class="fa-solid fa-check mr-2"></i> CONFIRMAR ALVO
                        </button>
                    </div>
                </div>
            </div>

            <!-- Direita: Logs -->
            <div class="w-full md:w-1/3 glass-panel rounded-xl flex flex-col h-1/2 md:h-full">
                <div class="px-4 py-3 border-b border-gray-800 flex justify-between items-center shrink-0">
                    <span class="font-bold text-sm"><i class="fa-solid fa-satellite-dish text-red-500 mr-2 pulse"></i> REGISTO DE COMBATE</span>
                </div>
                <div id="log-box" class="flex-1 p-4 overflow-y-auto space-y-2 text-sm flex flex-col-reverse" data-empty="1">
                    <!-- Logs entram aqui -->
                </div>
                <div class="px-4 py-2 border-t border-gray-800 text-xs font-mono shrink-0 flex justify-between">
                    <span class="text-gray-500">UPLINK: <span id="last-update" class="text-green-500">--:--:--</span></span>
                    <span id="conn-detail" class="text-gray-500">Aguardando...</span>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal Input Genérico -->
    <div id="modal-box" class="hidden fixed inset-0 z-[9999] flex items-center justify-center bg-black/80 p-4 opacity-0 transition-opacity duration-300">
        <div class="bg-gray-900 border border-gray-700 rounded-xl max-w-sm w-full p-6 text-center shadow-2xl">
            <h3 class="text-xl font-bold text-white mb-2" id="modal-title">Título</h3>
            <div id="modal-text" class="text-gray-400 text-sm mb-4">Texto</div>
            
            <div id="modal-input-container" class="hidden mb-4">
                <input type="text" id="modal-input" class="w-full bg-gray-800 border border-gray-600 rounded p-3 text-white focus:outline-none focus:border-quiral text-center" placeholder="Escreva aqui...">
            </div>

            <div class="flex gap-2 justify-center">
                <button id="modal-btn-cancel" onclick="closeModal()" class="px-4 py-2 bg-gray-700 hover:bg-gray-600 text-white rounded font-bold transition hidden">CANCELAR</button>
                <button id="modal-btn-ok" onclick="closeModal()" class="px-6 py-2 bg-quiral hover:bg-emerald-600 text-gray-950 rounded font-bold transition w-full">OK</button>
            </div>
        </div>
    </div>

    <script>
        // Configuração Firebase Realtime Database Rest API
        const DB_BASE = "https://quiral-f97a2-default-rtdb.firebaseio.com";
        const DATA_URL = `${DB_BASE}/quiral.json`;
        const CONFIG_POS_URL = `${DB_BASE}/quiral_config/positions_gps.json`;
        const CONFIG_CENTER_URL = `${DB_BASE}/quiral_config/centro.json`;
        const LOGS_URL = `${DB_BASE}/quiral_logs.json`;
        
        // Estado da Aplicação
        let currentRole = null; // 'admin', 'azul', 'amarela'
        let currentTeamPass = null;
        let isAdmin = false;
        
        // Estado do Jogo (Memória Inteligente)
        let lastFullData = null;
        let lastSuccessfulFetch = 0;
        let mapDataInterval = null;
        let logsDataInterval = null;
        let estadoAnteriorJogo = null;
        let donosAnterioresNos = {};
        
        // Leaflet / Mapa
        let map = null;
        let nodesLayer = null;
        let markersLayer = null;
        let playerLocationMarker = null;
        let defaultCenter = [-17.763466, -48.618683]; // Centro Padrão
        
        // Marcador Tático (Uber Style)
        let isSelectingTarget = false;
        
        // Dados de Posição
        let nodePositions = {}; // ID -> {lat, lng}

        // Logs Control
        let renderedLogKeys = new Set();
        let logsAtuais = {};

        // Utilidade: Toast
        function mostrarToast(mensagem, tipo = 'success') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = `toast ${tipo}`;
            toast.innerText = mensagem;
            container.appendChild(toast);
            setTimeout(() => {
                toast.style.opacity = '0';
                toast.style.transform = 'translateY(-20px)';
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }

        // Utilidade: Modal
        let currentModalCallback = null;
        function showModal(title, html, requireInput = false, callback = null) {
            document.getElementById('modal-title').innerText = title;
            document.getElementById('modal-text').innerHTML = html;
            
            const inputContainer = document.getElementById('modal-input-container');
            const inputEl = document.getElementById('modal-input');
            const btnCancel = document.getElementById('modal-btn-cancel');
            const btnOk = document.getElementById('modal-btn-ok');

            currentModalCallback = callback;

            if (requireInput) {
                inputContainer.classList.remove('hidden');
                btnCancel.classList.remove('hidden');
                btnOk.classList.remove('w-full');
                inputEl.value = '';
                
                btnOk.onclick = () => {
                    if (inputEl.value.trim() === '') return;
                    if (currentModalCallback) currentModalCallback(inputEl.value.trim());
                    closeModal();
                };
                
                // Enter para submeter
                inputEl.onkeypress = (e) => { if(e.key === 'Enter') btnOk.click(); };
            } else {
                inputContainer.classList.add('hidden');
                btnCancel.classList.add('hidden');
                btnOk.classList.add('w-full');
                btnOk.onclick = closeModal;
            }

            const box = document.getElementById('modal-box');
            box.classList.remove('hidden');
            requestAnimationFrame(() => {
                box.classList.remove('opacity-0');
                if (requireInput) inputEl.focus();
            });
        }
        function closeModal() {
            const box = document.getElementById('modal-box');
            box.classList.add('opacity-0');
            setTimeout(() => box.classList.add('hidden'), 300);
            currentModalCallback = null;
        }

        window.onload = function() {
            verificarLogin();
            if (currentRole) iniciarApp();
        };

        function verificarLogin() {
            const role = localStorage.getItem('quiral_role');
            const pass = localStorage.getItem('quiral_pass');
            if (role && pass) { currentRole = role; currentTeamPass = pass; isAdmin = (role === 'admin'); }
        }

        async function fazerLogin() {
            const pass = document.getElementById('login-pass').value.trim();
            if (!pass) return;
            const btn = document.querySelector('#login-screen button');
            btn.innerText = "A VERIFICAR...";
            
            try {
                const res = await fetch(`${DB_BASE}/quiral_auth.json`);
                const authData = await res.json();
                let foundRole = null;
                
                for (const [r, data] of Object.entries(authData || {})) {
                    if (data.passHash === pass) { foundRole = r; break; }
                }

                if (foundRole) {
                    currentRole = foundRole;
                    currentTeamPass = pass;
                    isAdmin = (foundRole === 'admin');
                    localStorage.setItem('quiral_role', currentRole);
                    localStorage.setItem('quiral_pass', pass);
                    iniciarApp();
                } else {
                    document.getElementById('login-error').classList.remove('hidden');
                    btn.innerText = "AUTENTICAR";
                }
            } catch (e) {
                document.getElementById('login-error').innerText = "Erro de rede.";
                document.getElementById('login-error').classList.remove('hidden');
                btn.innerText = "AUTENTICAR";
            }
        }

        function logout() {
            localStorage.removeItem('quiral_role'); localStorage.removeItem('quiral_pass');
            currentRole = null; currentTeamPass = null; isAdmin = false;
            clearInterval(mapDataInterval); clearInterval(logsDataInterval);
            document.getElementById('app-screen').classList.add('hidden');
            document.getElementById('login-screen').classList.remove('hidden');
            document.getElementById('login-pass').value = '';
            document.getElementById('login-error').classList.add('hidden');
            document.querySelector('#login-screen button').innerText = "AUTENTICAR";
        }

        async function iniciarApp() {
            document.getElementById('login-screen').classList.add('hidden');
            document.getElementById('app-screen').classList.remove('hidden');
            document.getElementById('app-screen').classList.add('flex');
            
            if (isAdmin) {
                document.getElementById('btn-save-layout').classList.remove('hidden');
                document.getElementById('btn-centro').classList.remove('hidden');
            }

            await initLeafletMap();
            
            // Loop principal
            fetchUplinkData(); fetchLogs();
            mapDataInterval = setInterval(fetchUplinkData, 2000);
            logsDataInterval = setInterval(fetchLogs, 3000);
        }

        async function initLeafletMap() {
            if (map) { map.remove(); map = null; }
            
            // Tentar ler centro gravado na Firebase
            let center = defaultCenter;
            try {
                const res = await fetch(CONFIG_CENTER_URL);
                const cData = await res.json();
                if (cData && cData.lat && cData.lng) {
                    center = [parseFloat(cData.lat), parseFloat(cData.lng)];
                }
            } catch(e) { console.log("Usando centro padrão."); }

            // IMPORTANTE: tap:false previne bugs de clique no telemóvel
            map = L.map('map', { zoomControl: false, tap: false }).setView(center, 18);
            L.control.zoom({ position: 'bottomright' }).addTo(map);

            // Satellite Layer (ESRI) com maxNativeZoom para evitar quadrados cinzentos
            L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
                attribution: 'Tiles &copy; Esri &mdash; Source: Esri, i-cubed, USDA, USGS, AEX, GeoEye, Getmapping, Aerogrid, IGN, IGP, UPR-EGP, and the GIS User Community',
                maxNativeZoom: 17,
                maxZoom: 22
            }).addTo(map);

            nodesLayer = L.layerGroup().addTo(map);
            markersLayer = L.layerGroup().addTo(map);

            // Carregar Posições GPS das bases guardadas
            try {
                const res = await fetch(CONFIG_POS_URL);
                const pos = await res.json();
                if (pos) {
                    for (const [nid, coords] of Object.entries(pos)) {
                        nodePositions[nid] = { lat: parseFloat(coords.lat), lng: parseFloat(coords.lng) };
                    }
                }
            } catch(e) {}

            // Atualiza tamanho do mapa no layout flex
            setTimeout(() => map.invalidateSize(), 500);
        }

        function updateStatusBadge(type, playing) {
            const badge = document.getElementById('status-badge');
            if (type === 'ok' && playing) { badge.innerText = "SISTEMA ONLINE - JOGO EM ANDAMENTO"; badge.className = "mt-1 inline-block px-3 py-0.5 rounded text-xs font-bold bg-green-900/50 text-green-400 border border-green-500 pulse"; }
            else if (type === 'ok' && !playing) { badge.innerText = "SISTEMA OCIOSO / AGUARDANDO LIGAÇÃO"; badge.className = "mt-1 inline-block px-3 py-0.5 rounded text-xs font-bold bg-gray-800 text-gray-500 border border-gray-600"; }
            else { badge.innerText = "FALHA DE SINAL FIREBASE"; badge.className = "mt-1 inline-block px-3 py-0.5 rounded text-xs font-bold bg-red-900/50 text-red-400 border border-red-600 pulse"; }
        }

        async function fetchUplinkData() {
            try {
                const response = await fetch(DATA_URL + "?nocache=" + Date.now());
                const data = await response.json(); if (!data) return;
                lastSuccessfulFetch = Date.now(); 
                
                document.getElementById('last-update').innerText = new Date().toLocaleTimeString('pt-PT'); 
                document.getElementById('conn-detail').innerText = 'Ligação Estabelecida';
                const isPlaying = (data.st === "ON");

                // 1. Limpeza no inicio do jogo
                if (estadoAnteriorJogo === 'OFF' && isPlaying) {
                    document.getElementById('log-box').innerHTML = '';
                    document.getElementById('log-box').dataset.empty = '1';
                    renderedLogKeys.clear();
                    if (isAdmin) fetch(LOGS_URL, { method: 'PUT', body: 'null' });
                }

                // 2. Scoreboard & Vencedor
                document.getElementById('score-azul').innerText = data.az || "0"; 
                document.getElementById('score-amarelo').innerText = data.am || "0"; 

                if (!isPlaying && data.az !== undefined && data.am !== undefined) {
                    document.getElementById('game-time').innerText = "FIM"; 
                    let winText = "EMPATE TÁTICO"; let winColor = "text-gray-400";
                    if (parseInt(data.az) > parseInt(data.am)) { winText = "🏆 AZUL VENCE"; winColor = "text-blue-400"; }
                    else if (parseInt(data.am) > parseInt(data.az)) { winText = "🏆 AMARELA VENCE"; winColor = "text-yellow-400"; }
                    
                    document.getElementById('game-mode').innerHTML = `<span class="${winColor} font-bold">${winText}</span>`;
                    
                    if (estadoAnteriorJogo === 'ON') {
                        showModal('FIM DA PARTIDA', `<div class="text-2xl mt-4 mb-4 font-bold ${winColor}">${winText}</div>`);
                    }
                } else {
                    document.getElementById('game-time').innerText = data.tp || "00:00"; 
                    document.getElementById('game-mode').innerText = "MODO: " + (data.md || "--");
                }

                updateStatusBadge('ok', isPlaying);
                
                // 3. Processar Bases (Nós) e Neutralizações
                if (data.nos && Array.isArray(data.nos)) {
                    const online = data.nos.filter(n => n.online).length; 
                    document.getElementById('node-count').textContent = `(${online}/${data.nos.length} online)`;
                    
                    data.nos.forEach((node, index) => {
                        const id = index + 1;
                        if (estadoAnteriorJogo === 'ON' && isPlaying && data.md !== "QUIRAL") {
                            const anterior = donosAnterioresNos[id];
                            if ((anterior === 1 || anterior === 2) && node.owner === 0) {
                                const Equipe = anterior === 1 ? "AZUL" : "AMARELA";
                                const cor = anterior === 1 ? "text-blue-400" : "text-yellow-400";
                                if (isAdmin) { // Só admin injeta log neutro na nuvem para não duplicar
                                    fetch(`${LOGS_URL}.json`, {
                                        method: 'POST',
                                        body: JSON.stringify({
                                            ts: Date.now(), msg: `Nó ${id} NEUTRALIZADO (Perdido pela ${Equipe})`
                                        })
                                    });
                                }
                            }
                        }
                        donosAnterioresNos[id] = node.owner;
                    });

                    renderVisuals(data);
                }
                
                // Atualizar marcadores táticos de jogadores
                syncMarcadores();

                estadoAnteriorJogo = data.st;
                lastFullData = data;
            } catch (error) { 
                updateStatusBadge('error', false); 
                document.getElementById('conn-detail').innerText = 'Falha na Ligação DB'; 
            }
        }

        function renderVisuals(data) {
            if(!map) return;
            nodesLayer.clearLayers();
            
            const center = map.getCenter();
            
            data.nos.forEach((node, index) => {
                const id = index + 1;
                if (!node.online) return;

                // Definir Cor
                let corClasse = "neutro";
                if (node.owner === 1) corClasse = "azul";
                else if (node.owner === 2) corClasse = "amarela";

                // Definir Posição (GPS Real ou layout simulado em torno do centro)
                let pos = nodePositions[id];
                if (!pos) {
                    const angle = (index / data.nos.length) * (2 * Math.PI);
                    const rad = 0.0005; // ~50m raio simulado
                    pos = { lat: center.lat + rad * Math.cos(angle), lng: center.lng + rad * Math.sin(angle) };
                }

                // Ícone HTML
                const iconHTML = `
                    <div class="node-marker ${corClasse}" style="width:100%; height:100%; pointer-events:auto;" onclick="onNodeTap(${id}, event)">
                        ${id}
                    </div>
                `;

                const icon = L.divIcon({
                    html: iconHTML,
                    className: 'bg-transparent',
                    iconSize: [36, 36],
                    iconAnchor: [18, 18]
                });

                const marker = L.marker([pos.lat, pos.lng], {
                    icon: icon, draggable: isAdmin, id: id
                });

                // Se Admin arrastar, atualiza a posição provisória (pendente de salvar)
                if (isAdmin) {
                    marker.on('dragend', function(e) {
                        const newPos = e.target.getLatLng();
                        nodePositions[id] = { lat: newPos.lat, lng: newPos.lng };
                        marcarLayoutPendente();
                    });
                }

                marker.addTo(nodesLayer);
            });
        }

        // Evento de clique seguro no telemóvel para ordens (Attack/Defend)
        function onNodeTap(nodeId, event) {
            L.DomEvent.stopPropagation(event); // Impede que o clique passe para o mapa
            
            if (isAdmin) return; // Admin apenas arrasta
            
            const targetTeam = (currentRole === 'azul') ? 1 : 2;
            const myColorClass = targetTeam === 1 ? 'text-blue-400' : 'text-yellow-400';
            
            showModal(`NÓ TÁTICO ${nodeId}`, `Enviar ordem de combate para a Equipe ${currentRole.toUpperCase()}?`, false, () => {
                // Ao clicar OK: Envia a ordem (No seu sistema original não havia body complexo de ordens,
                // vou assumir um envio de timestamp/ping para a rota certa)
                const payload = { ordem: 'atacar', ts: Date.now() }; // Ajustar conforme o hardware lê
                
                fetch(`${DB_BASE}/quiral_comandos/${currentRole}/${nodeId}.json`, {
                    method: 'PUT', body: JSON.stringify(payload)
                }).then(() => {
                    mostrarToast(`Ordem enviada para Nó ${nodeId}`);
                }).catch(() => mostrarToast("Falha no envio da ordem", 'error'));
            });
        }

        function toggleMarcador() {
            isSelectingTarget = !isSelectingTarget;
            const btnMarcador = document.getElementById('btn-marcador');
            const crosshair = document.getElementById('map-crosshair');
            const btnConfirm = document.getElementById('btn-confirm-target');

            if (isSelectingTarget) {
                btnMarcador.classList.replace('bg-purple-900/50', 'bg-purple-500');
                btnMarcador.classList.add('animate-pulse');
                crosshair.style.opacity = '1';
                btnConfirm.classList.add('active');
            } else {
                btnMarcador.classList.replace('bg-purple-500', 'bg-purple-900/50');
                btnMarcador.classList.remove('animate-pulse');
                crosshair.style.opacity = '0';
                btnConfirm.classList.remove('active');
            }
        }

        function confirmarMarcador() {
            if (!isSelectingTarget) return;
            const center = map.getCenter();
            
            // Fecha a mira
            toggleMarcador();

            // Pede o nome num modal seguro para telemóveis
            showModal("NOVO ALVO TÁTICO", "Identificação ou objetivo do marcador:", true, (nome) => {
                const team = (currentRole === 'admin') ? 'geral' : currentRole;
                const id = "m_" + Date.now();
                const payload = { lat: center.lat, lng: center.lng, label: nome };

                // Otimista: Desenha logo
                desenharPinMap(id, payload, team);
                
                // Envia DB
                fetch(`${DB_BASE}/quiral_config/marcadores/${team}/${id}.json`, {
                    method: 'PUT', body: JSON.stringify(payload)
                }).then(res => {
                    if (res.ok) mostrarToast("Alvo marcado com sucesso!");
                    else throw new Error("Bloqueado");
                }).catch(() => {
                    mostrarToast("Erro! Firebase bloqueou gravação.", 'error');
                });
            });
        }

        // Lê e Sincroniza Marcadores
        async function syncMarcadores() {
            if(!map) return;
            try {
                const res = await fetch(`${DB_BASE}/quiral_config/marcadores.json`);
                const allMarkers = await res.json();
                
                markersLayer.clearLayers();
                
                if (allMarkers) {
                    const validTeams = isAdmin ? ['geral', 'azul', 'amarela'] : ['geral', currentRole];
                    validTeams.forEach(team => {
                        if (allMarkers[team]) {
                            Object.entries(allMarkers[team]).forEach(([id, m]) => {
                                desenharPinMap(id, m, team);
                            });
                        }
                    });
                }
            } catch(e) {}
        }

        function desenharPinMap(id, markerData, team) {
            let color = team === 'azul' ? '#3b82f6' : (team === 'amarela' ? '#eab308' : '#c026d3');
            let teamName = team === 'azul' ? 'AZUL' : (team === 'amarela' ? 'AMARELA' : 'COMANDO');
            
            const html = `
                <div class="flex flex-col items-center justify-center -mt-8" onclick="onPinClick('${team}', '${id}')" style="pointer-events: auto; cursor:pointer;">
                    <div class="w-4 h-4 rounded-full shadow-[0_0_10px_#fff] mb-1" style="background-color: ${color}; border: 2px solid white;"></div>
                    <div class="bg-black/80 text-white text-xs font-bold px-2 py-1 rounded border border-gray-600 whitespace-nowrap w-max shadow-lg">
                        ${markerData.label} <span class="text-[9px] opacity-70">(${teamName})</span>
                    </div>
                </div>
            `;
            const icon = L.divIcon({ html: html, className: 'bg-transparent', iconSize: [120, 50], iconAnchor: [60, 25] });
            L.marker([parseFloat(markerData.lat), parseFloat(markerData.lng)], {icon: icon}).addTo(markersLayer);
        }

        function onPinClick(team, id) {
            if (isAdmin || team === currentRole) {
                // Delete sem prompt (rápido para combate)
                fetch(`${DB_BASE}/quiral_config/marcadores/${team}/${id}.json`, { method: 'DELETE' })
                .then(() => {
                    mostrarToast("Marcador removido");
                    syncMarcadores();
                });
            }
        }

        function centralizarNoJogador() {
            if ("geolocation" in navigator) {
                mostrarToast("A procurar sinal GPS...", "success");
                navigator.geolocation.getCurrentPosition(
                    (position) => {
                        const lat = position.coords.latitude;
                        const lng = position.coords.longitude;
                        
                        map.flyTo([lat, lng], 20, { duration: 1.5 });
                        
                        if (playerLocationMarker) map.removeLayer(playerLocationMarker);
                        
                        const html = `<div class="w-5 h-5 bg-blue-500 rounded-full border-2 border-white shadow-[0_0_15px_#3b82f6] animate-pulse"></div>`;
                        const icon = L.divIcon({ html: html, className: 'bg-transparent', iconSize: [20, 20], iconAnchor: [10, 10] });
                        
                        playerLocationMarker = L.marker([lat, lng], {icon: icon, zIndexOffset: 1000}).addTo(map);
                    },
                    (error) => {
                        mostrarToast("Ative o GPS do telemóvel para se localizar.", "error");
                    },
                    { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
                );
            } else {
                mostrarToast("GPS não suportado neste dispositivo.", "error");
            }
        }

        function marcarLayoutPendente() {
            document.getElementById('btn-save-layout').classList.replace('text-orange-300', 'text-white');
            document.getElementById('btn-save-layout').classList.add('bg-orange-600', 'animate-pulse');
        }

        async function salvarLayout() {
            try {
                // Converter de {1: {lat,lng}, 2: {lat,lng}} para o formato esperado pelo json
                const savePayload = {};
                for(const [id, coords] of Object.entries(nodePositions)){
                    savePayload[id] = { lat: parseFloat(coords.lat), lng: parseFloat(coords.lng) };
                }
                
                const res = await fetch(CONFIG_POS_URL, {
                    method: 'PUT', body: JSON.stringify(savePayload)
                });
                
                if (res.ok) {
                    mostrarToast("Layout Tático guardado com sucesso!");
                    const btn = document.getElementById('btn-save-layout');
                    btn.classList.replace('text-white', 'text-orange-300');
                    btn.classList.remove('bg-orange-600', 'animate-pulse');
                } else {
                    throw new Error("Erro de permissão");
                }
            } catch(e) {
                mostrarToast("Erro ao guardar. Verifique regras Firebase.", 'error');
            }
        }

        function definirCentroMapa() {
            isSelectingTarget = true; // Reusa a mecânica do marcador, mas para o centro
            const crosshair = document.getElementById('map-crosshair');
            const btnConfirm = document.getElementById('btn-confirm-target');
            
            crosshair.style.opacity = '1';
            btnConfirm.innerHTML = '<i class="fa-solid fa-map-location-dot mr-2"></i> CONFIRMAR CENTRO';
            btnConfirm.classList.replace('bg-green-600', 'bg-indigo-600');
            btnConfirm.classList.add('active');

            // Substituir a ação do botão temporariamente
            const originalConfirm = btnConfirm.onclick;
            btnConfirm.onclick = async () => {
                const center = map.getCenter();
                try {
                    const res = await fetch(CONFIG_CENTER_URL, {
                        method: 'PUT', body: JSON.stringify({lat: center.lat, lng: center.lng})
                    });
                    if (res.ok) {
                        mostrarToast("Centro de Campo atualizado!");
                        // Restaura botão
                        btnConfirm.innerHTML = '<i class="fa-solid fa-check mr-2"></i> CONFIRMAR ALVO';
                        btnConfirm.classList.replace('bg-indigo-600', 'bg-green-600');
                        btnConfirm.onclick = originalConfirm;
                        isSelectingTarget = false;
                        crosshair.style.opacity = '0';
                        btnConfirm.classList.remove('active');
                        // Forçar redraw nas posições genéricas se aplicável
                        fetchUplinkData();
                    }
                } catch(e) {}
            };
        }

        async function fetchLogs() {
            try {
                const response = await fetch(`${LOGS_URL}?orderBy="ts"&limitToLast=20`);
                const data = await response.json();
                if (!data) return;
                
                const box = document.getElementById('log-box');
                if(box.dataset.empty === '1') { box.innerHTML = ''; box.dataset.empty = '0'; }
                
                let added = false;
                Object.entries(data).sort((a,b) => a[1].ts - b[1].ts).forEach(([key, log]) => {
                    if (!renderedLogKeys.has(key)) {
                        const date = new Date(log.ts);
                        const time = date.toLocaleTimeString('pt-PT', {hour: '2-digit', minute:'2-digit', second:'2-digit'});
                        
                        const div = document.createElement('div');
                        div.className = "py-1 border-b border-gray-800/50 opacity-0 transition-opacity duration-500";
                        div.innerHTML = `<span class="text-gray-500">[${time}]</span> <span class="text-gray-300">${log.msg}</span>`;
                        box.prepend(div);
                        
                        setTimeout(() => div.classList.remove('opacity-0'), 50);
                        renderedLogKeys.add(key);
                        added = true;
                    }
                });
            } catch(e) {}
        }

        function toggleFullscreen() {
            if (!document.fullscreenElement) { document.documentElement.requestFullscreen().catch(err => {}); } 
            else { document.exitFullscreen(); }
        }

        // PWA Service Worker Registration
        if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js').catch(err => {
                    console.log('SW falhou (normal se estiver num preview web sem https real).', err);
                });
            });
        }
    </script>
</body>
